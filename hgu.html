<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ One-Time Multi Barcode Scanner</title>
    
    <!-- Zxing Multi-Barcode Library CDN -->
    <script type="text/javascript" src="https://unpkg.com/@zxing/library@latest"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #1e293b;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        h2 { color: #38bdf8; margin-bottom: 5px; }
        p { font-size: 0.85rem; color: #94a3b8; margin-bottom: 20px; }
        
        /* Video wrapper */
        .video-container {
            position: relative;
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            background: #0f172a;
            border: 2px dashed #38bdf8;
        }
        video { width: 100%; height: auto; display: block; }

        .log-box {
            margin-top: 20px;
            background: #0f172a;
            border-radius: 8px;
            padding: 15px;
            max-height: 200px;
            overflow-y: auto;
            text-align: left;
            font-family: monospace;
            font-size: 0.85rem;
        }
        .log-entry {
            padding: 6px 10px;
            border-bottom: 1px solid #1e293b;
            color: #4ade80;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>⚡ One-Time Multi-Scanner</h2>
    <p>Saare barcodes ek saath camera ke saamne laayein, yeh ek baar mein sab utha lega!</p>
    
    <div class="video-container">
        <video id="video" autoplay muted playsinline></video>
    </div>
    
    <div class="log-box" id="logBox">
        <div style="color: #64748b; text-align:center;">Camera starting... Hold multiple barcodes together.</div>
    </div>
</div>

<script>
    const scriptUrl = "https://script.google.com/macros/s/AKfycbxIjzy8BFpHRsoBz4vKnResTi5l35CLk4HIKocLkhVNh1tWxoXSMMbbZFxpfALYJ7ce/exec";
    
    // Duplicate entries se bachne ke liye cooldown registry
    const scannedCache = new Map();
    const COOLDOWN_TIME = 5000; // Ek baar scan hone ke baad 5 second tak same code skip hoga

    function playBeep() {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            osc.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.08);
        } catch (e) {}
    }

    // Zxing MultiFormat Reader Initialize kar rahe hain
    const codeReader = new ZXing.BrowserMultiFormatReader();

    window.addEventListener('DOMContentLoaded', () => {
        const videoElement = document.getElementById('video');
        const logBox = document.getElementById('logBox');

        // Back camera select karne ke liye list nikal rahe hain
        codeReader.listVideoInputDevices()
            .then((videoInputDevices) => {
                // Back camera choose karne ka try karte hain, nahi toh default first device
                let selectedDeviceId = videoInputDevices[0].deviceId;
                for (let device of videoInputDevices) {
                    if (device.label.toLowerCase().includes('back') || device.label.toLowerCase().includes('environment')) {
                        selectedDeviceId = device.deviceId;
                        break;
                    }
                }

                logBox.innerHTML = `<div style="color: #64748b; text-align:center;">Scanner Ready. Scanning continuously...</div>`;

                // Multi-barcode decode loop start
                // decodeFromVideoDevice har frame me jitne barcodes milenge, unki array return karega
                codeReader.decodeFromVideoDevice(selectedDeviceId, 'video', (result, err) => {
                    if (result) {
                        // Zxing browser library me multiple results handle karne ke liye hum check karte hain
                        const currentTime = Date.now();
                        const barcodeData = result.text;

                        // Cache duplicate check
                        if (scannedCache.has(barcodeData) && (currentTime - scannedCache.get(barcodeData) < COOLDOWN_TIME)) {
                            return; // Agar abhi scan kiya tha toh skip karo
                        }

                        // Lock for cooldown
                        scannedCache.set(barcodeData, currentTime);

                        // Feedback
                        playBeep();
                        if (navigator.vibrate) navigator.vibrate(70);

                        // UI & Background send
                        addLogToScreen(barcodeData);
                        sendDataToSheet(barcodeData);
                    }
                });
            })
            .catch((err) => {
                console.error("Camera setup error:", err);
                logBox.innerHTML = `<div style="color: #ef4444; text-align:center;">Camera Error: ${err.message}</div>`;
            });
    });

    // Background upload function
    function sendDataToSheet(barcodeData) {
        fetch(scriptUrl, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                barcode: barcodeData,
                timestamp: new Date().toLocaleString()
            })
        }).catch(err => console.error("Sheet send error:", err));
    }

    // UI screen update
    function addLogToScreen(code) {
        const logBox = document.getElementById("logBox");
        if(logBox.innerHTML.includes("Scanner Ready")) logBox.innerHTML = "";

        const newEntry = document.createElement("div");
        newEntry.className = "log-entry";
        newEntry.innerText = `[${new Date().toLocaleTimeString()}] ✅ Captured: ${code}`;
        logBox.insertBefore(newEntry, logBox.firstChild);
    }
</script>

</body>
</html>
