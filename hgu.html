<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ Instant Barcode Scanner to Google Sheets</title>
    
    <!-- Sabse fast open-source QR/Barcode library CDN se -->
    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: #f5f7fb;
            color: #333;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h2 {
            color: #1a73e8;
            margin-bottom: 5px;
        }
        p {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 20px;
        }
        /* Camera UI Window */
        #reader {
            width: 100%;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            overflow: hidden;
            background: #fafafa;
        }
        /* Status & Result Logs */
        .status-box {
            margin-top: 20px;
            padding: 12px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            display: none;
        }
        .success {
            background-color: #e6f4ea;
            color: #137333;
        }
        .sending {
            background-color: #e8f0fe;
            color: #1a73e8;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>⚡ Fast Barcode Scanner</h2>
    <p>Camera permission allow karein aur barcode saamne laayein</p>
    
    <!-- Scanner Camera Window -->
    <div id="reader"></div>
    
    <!-- Real-time Status Updates -->
    <div id="status" class="status-box"></div>
</div>

<script>
    // 1. Aapka Google Apps Script Web App URL
    const scriptUrl = "https://script.google.com/macros/s/AKfycbxIjzy8BFpHRsoBz4vKnResTi5l35CLk4HIKocLkhVNh1tWxoXSMMbbZFxpfALYJ7ce/exec";

    // Beep sound create karne ke liye Web Audio API (Bina kisi external mp3 file ke)
    function playBeep() {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            osc.type = "sine";
            osc.frequency.setValueAtTime(800, ctx.currentTime); // Sound pitch
            osc.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.1); // Sound duration (100ms)
        } catch (e) { console.log("Audio play nahi ho paya"); }
    }

    // 2. HTML5-QR-Code Scanner Initialization
    const html5QrCode = new Html5Qrcode("reader");
    
    // Speed aur accuracy ke liye settings config
    const config = { 
        fps: 25, // High frames per second for instant capture
        qrbox: (w, h) => ({ width: w * 0.85, height: h * 0.45 }), // Barcode friendly horizontal box
        formatsToSupport: [ 
            Html5QrcodeSupportedFormats.QR_CODE,
            Html5QrcodeSupportedFormats.EAN_13,
            Html5QrcodeSupportedFormats.CODE_128,
            Html5QrcodeSupportedFormats.CODE_39
        ]
    };

    // 3. SUCCESS CALLBACK: Jab barcode successfully read ho jaye
    const qrCodeSuccessCallback = (decodedText, decodedResult) => {
        console.log(`Scanned Code: ${decodedText}`);
        
        // Immediate feedbacks
        playBeep(); 
        if (navigator.vibrate) navigator.vibrate(100); 

        // Status update on screen
        showStatus(`Scanned: ${decodedText}. Sending to Sheet...`, 'sending');

        // Ek baar scan hote hi temporary camera pause karte hain taaki duplicate data na jaye
        stopScanner();

        // Data Google Sheet par bhejna
        sendDataToGoogleSheet(decodedText);
    };

    // 4. FAILURE CALLBACK: Frame analysis clear na hone par (Isse khali chhodna hai fast loop ke liye)
    const qrCodeErrorCallback = (err) => { /* Ignore constant errors for maximum speed */ };

    // 5. GOOGLE SHEET DATA NETWORK SEND LOGIC
    function sendDataToGoogleSheet(barcodeData) {
        const payload = {
            barcode: barcodeData,
            timestamp: new Date().toLocaleString()
        };

        // Fetch API se POST request
        fetch(scriptUrl, {
            method: "POST",
            mode: "no-cors", // Google Apps Script redirects ke liye zaroori hai
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        })
        .then(() => {
            showStatus(`✓ Saved: ${barcodeData}`, 'success');
            
            // 2.5 second baad agla barcode scan karne ke liye scanner auto-restart ho jayega
            setTimeout(startScanner, 2500); 
        })
        .catch((error) => {
            console.error("Error sending data:", error);
            showStatus("❌ Failed to send data. Retrying...", "sending");
            setTimeout(startScanner, 2500);
        });
    }

    // 6. CAMERA CONTROL FUNCTIONS
    function startScanner() {
        html5QrCode.start(
            { facingMode: "environment" }, // Focus on back camera
            config,
            qrCodeSuccessCallback,
            qrCodeErrorCallback
        ).catch(err => console.error("Camera Start Error:", err));
    }

    function stopScanner() {
        html5QrCode.stop().catch(err => console.error("Camera Stop Error:", err));
    }

    // UI Status dynamic updater helper
    function showStatus(text, className) {
        const statusDiv = document.getElementById("status");
        statusDiv.innerText = text;
        statusDiv.className = `status-box ${className}`;
        statusDiv.style.display = "block";
    }

    // Page ready hote hi automatically back camera start ho jayega
    window.addEventListener('DOMContentLoaded', startScanner);
</script>

</body>
</html>
