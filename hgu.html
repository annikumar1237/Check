<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ Smart Unique Barcode Scanner</title>
    
    <!-- Fast QR/Barcode library CDN -->
    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #1e293b;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        h2 { color: #38bdf8; margin-bottom: 5px; }
        p { font-size: 0.85rem; color: #94a3b8; margin-bottom: 20px; }
        
        #reader {
            width: 100%;
            border: 2px dashed #38bdf8;
            border-radius: 12px;
            overflow: hidden;
            background: #0f172a;
        }
        
        /* Confirmation Box */
        .confirm-box {
            display: none;
            margin-top: 20px;
            background: #1e293b;
            border: 2px solid #22c55e;
            border-radius: 12px;
            padding: 20px;
        }
        .scanned-value {
            font-size: 1.4rem;
            font-weight: bold;
            color: #4ade80;
            margin: 10px 0 20px 0;
            word-break: break-all;
            background: #0f172a;
            padding: 10px;
            border-radius: 8px;
        }
        
        .btn {
            width: 100%;
            padding: 15px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 10px;
        }
        .btn-ok { background-color: #22c55e; color: white; }
        .btn-ok:active { background-color: #16a34a; }
        .btn-cancel { background-color: #ef4444; color: white; font-size: 1rem; padding: 10px; }
        
        /* Count Badge */
        .count-badge {
            margin-top: 15px;
            font-size: 0.9rem;
            color: #a7f3d0;
            background: #064e3b;
            padding: 6px 12px;
            display: inline-block;
            border-radius: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>⚡ Unique Barcode Scanner</h2>
    <p>Jo ek baar successfully scan ho gaya, woh dobara scan nahi hoga</p>
    
    <div id="reader"></div>
    
    <div class="count-badge" id="countBadge">Unique Scanned: 0</div>
    
    <!-- Confirmation Popup -->
    <div class="confirm-box" id="confirmBox">
        <div style="color: #94a3b8; font-size: 0.9rem;">New Barcode Found:</div>
        <div class="scanned-value" id="scannedValue">---</div>
        
        <button class="btn btn-ok" id="btnSend">✓ OK (Send to Sheet)</button>
        <button class="btn btn-cancel" id="btnCancel">❌ Cancel / Rescan</button>
    </div>
</div>

<script>
    const scriptUrl = "https://script.google.com/macros/s/AKfycbxIjzy8BFpHRsoBz4vKnResTi5l35CLk4HIKocLkhVNh1tWxoXSMMbbZFxpfALYJ7ce/exec";
    
    let currentBarcode = ""; 
    const html5QrCode = new Html5Qrcode("reader");
    
    // 🔴 PERMANENT MEMORY: Jo scan ho chuke hain unki list yahan rahegi
    const permanentHistory = new Set(); 
    
    const config = { 
        fps: 25, 
        qrbox: (w, h) => ({ width: w * 0.85, height: h * 0.45 }),
        formatsToSupport: [ 
            Html5QrcodeSupportedFormats.QR_CODE,
            Html5QrcodeSupportedFormats.EAN_13,
            Html5QrcodeSupportedFormats.CODE_128
        ]
    };

    function playBeep() {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            osc.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.08);
        } catch (e) {}
    }

    // 1. CAMERA SCAN FUNCTION
    const qrCodeSuccessCallback = (decodedText, decodedResult) => {
        // 🔥 CRITICAL CHECK: Agar yeh barcode pehle se history me hai, toh chupchaap ignore maaro, camera chalu rahega
        if (permanentHistory.has(decodedText)) {
            return; 
        }

        // Agar bilkul naya barcode hai, toh hi camera ko pause karo confirmation ke liye
        stopScanner();
        
        playBeep();
        if (navigator.vibrate) navigator.vibrate(100);

        currentBarcode = decodedText;
        document.getElementById("scannedValue").innerText = decodedText;
        document.getElementById("confirmBox").style.display = "block";
    };

    const qrCodeErrorCallback = (err) => { /* Ignore frame errors */ };

    // 2. OK BUTTON CLICKED
    document.getElementById("btnSend").addEventListener("click", () => {
        if (!currentBarcode) return;

        const btnSend = document.getElementById("btnSend");
        btnSend.innerText = "Sending...";
        btnSend.disabled = true;

        const payload = {
            barcode: currentBarcode,
            timestamp: new Date().toLocaleString()
        };

        fetch(scriptUrl, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        })
        .then(() => {
            // 🔥 SUCCESS: Pehle memory me add karo taaki ab dobara scan na ho sake
            permanentHistory.add(currentBarcode);
            
            // UI par counter update karo
            document.getElementById("countBadge").innerText = `Unique Scanned: ${permanentHistory.size}`;
            
            resetScannerUI();
        })
        .catch((error) => {
            console.error("Error:", error);
            alert("❌ Network Error! Save nahi ho paya.");
            resetScannerUI();
        });
    });

    // 3. CANCEL CLICKED
    document.getElementById("btnCancel").addEventListener("click", () => {
        resetScannerUI();
    });

    function resetScannerUI() {
        currentBarcode = "";
        document.getElementById("confirmBox").style.display = "none";
        
        const btnSend = document.getElementById("btnSend");
        btnSend.innerText = "✓ OK (Send to Sheet)";
        btnSend.disabled = false;

        startScanner();
    }

    function startScanner() {
        html5QrCode.start(
            { facingMode: "environment" },
            config,
            qrCodeSuccessCallback,
            qrCodeErrorCallback
        ).catch(err => console.error("Camera Error:", err));
    }

    window.addEventListener('DOMContentLoaded', startScanner);
</script>

</body>
</html>
