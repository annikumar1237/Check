<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Fast Barcode Scanner</title>
    <!-- Sabse fast QR/Barcode library CDN se -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
        }
        #reader {
            width: 100%;
            max-width: 500px;
            margin: 20px auto;
            border: 2px solid #333;
            border-radius: 8px;
            overflow: hidden;
            background: #fff;
        }
        #result {
            font-size: 1.2rem;
            font-weight: bold;
            color: #2e7d32;
            margin-top: 20px;
            padding: 10px;
            background: #e8f5e9;
            display: inline-block;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <h2>⚡ Super Fast Barcode Scanner</h2>
    <p>Camera access allow karein aur barcode saamne laayein.</p>
    
    <!-- Scanner Window -->
    <div id="reader"></div>
    
    <!-- Result Display -->
    <div id="result" style="display: none;">Scanned Result: <span id="scan-text"></span></div>

    <script>
        function onScanSuccess(decodedText, decodedResult) {
            // Jaise hi scan hoga, yeh function turant chalega
            document.getElementById('result').style.display = 'inline-block';
            document.getElementById('scan-text').innerText = decodedText;
            
            // Beep sound ya vibration add kar sakte ho yahan
            if (navigator.vibrate) navigator.vibrate(100); 
            
            console.log(`Code scanned = ${decodedText}`, decodedResult);
        }

        function onScanFailure(error) {
            // Fast scanning ke liye errors ko console me ignore karte hain
            // Kyunki library har millisecond frame scan karti hai
        }

        // Scanner Configuration (Speed badhane ke liye frames per second high rakha hai)
        let html5QrcodeScanner = new Html5QrcodeScanner(
            "reader", 
            { 
                fps: 20,              // Scan speed (Frames per second)
                qrbox: { width: 300, height: 150 }, // Barcode ke liye horizontal box size
                rememberLastUsedCamera: true
            }, 
            /* verbose= */ false
        );
        
        html5QrcodeScanner.render(onScanSuccess, onScanFailure);
    </script>
</body>
</html>
