<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ Non-Stop Continuous Barcode Scanner</title>
    
    <!-- Fast QR/Barcode library CDN -->
    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
            background-color: #0f172a; /* Dark theme jo premium lagta hai */
            color: #f8fafc;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #1e293b;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        h2 {
            color: #38bdf8;
            margin-bottom: 5px;
        }
        p {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 20px;
        }
        #reader {
            width: 100%;
            border: 2px dashed #38bdf8;
            border-radius: 12px;
            overflow: hidden;
            background: #0f172a;
        }
        /* Live feed box jahan scanned results flash honge */
        .log-box {
            margin-top: 20px;
            background: #0f172a;
            border-radius: 8px;
            padding: 10px;
            max-height: 150px;
            overflow-y: auto;
            text-align: left;
            font-family: monospace;
            font-size: 0.85rem;
        }
        .log-entry {
            padding: 6px 10px;
            border-bottom: 1px solid #1e293b;
            color: #4ade80;
        }
        .log-entry.sending {
            color: #38bdf8;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>⚡ Non-Stop Fast Scanner</h2>
    <p>Camera chalu rahega, bas ek ke baad ek barcode samne laate jao</p>
    
    <!-- Non-Stop Camera Window -->
    <div id="reader"></div>
    
    <!-- Live Scanned Items History -->
    <div class="log-box" id="logBox">
        <div style="color: #64748b; text-align:center; padding: 10px;">Scanned items will appear here instantly...</div>
    </div>
</div>

<script>
    const scriptUrl = "https://script.google.com/macros/s/AKfycbxIjzy8BFpHRsoBz4vKnResTi5l35CLk4HIKocLkhVNh1tWxoXSMMbbZFxpfALYJ7ce/exec";

    // Ek hi barcode baar-baar lagatar duplicate scan na ho, isliye memory registry
    const scannedCache = new Map();
    const COOLDOWN_TIME = 3000; // 3 seconds tak same barcode dobara scan nahi hoga (Baki naye codes instant honge)

    // Fast Beep Sound function
    function playBeep() {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            osc.type = "sine";
            osc.frequency.setValueAtTime(1000, ctx.currentTime); // High pitch for instant feel
            osc.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.08); // Short beep (80ms)
        } catch (e) {}
    }

    const html5QrCode = new Html5Qrcode("reader");
    
    const config = { 
        fps: 30, // Max speed frames per second
        qrbox: (w, h) => ({ width: w * 0.9, height: h * 0.4 }), // Wide horizontal area for barcodes
        formatsToSupport: [ 
            Html5QrcodeSupportedFormats.QR_CODE,
            Html5QrcodeSupportedFormats.EAN_13,
            Html5QrcodeSupportedFormats.CODE_128
        ]
    };

    // TURANT SCAN SUCCESS LOGIC (No Stop!)
    const qrCodeSuccessCallback = (decodedText, decodedResult) => {
        const currentTime = Date.now();
        
        // Agar yeh code abhi-abhi scan hua hai, toh ignore karo (Duplicate check)
        if (scannedCache.has(decodedText) && (currentTime - scannedCache.get(decodedText) < COOLDOWN_TIME)) {
            return; 
        }

        // Naya barcode milte hi memory me lock karo timestamp ke sath
        scannedCache.set(decodedText, currentTime);

        // Instant Audio & Haptic Feedback
        playBeep();
        if (navigator.vibrate) navigator.vibrate(70); 

        // Screen par bina time waste kiye log dikhao
        addLogToScreen(decodedText);

        // Background me chupke se data bhej do (Camera chalu rahega!)
        sendDataInBackground(decodedText);
    };

    const qrCodeErrorCallback = (err) => { /* Fast scanning engine, ignore errors */ };

    // BACKGROUND DATA SEND (Bina loop roke)
    function sendDataInBackground(barcodeData) {
        const payload = {
            barcode: barcodeData,
            timestamp: new Date().toLocaleString()
        };

        // Network call parallel chalega, script block nahi hogi
        fetch(scriptUrl, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        })
        .then(() => {
            console.log(`Sent: ${barcodeData}`);
        })
        .catch((error) => {
            console.error("Failed to send:", error);
        });
    }

    // Live Feed UI Helper
    function addLogToScreen(code) {
        const logBox = document.getElementById("logBox");
        
        // Pehli baar me placeholder hatane ke liye
        if(logBox.innerHTML.includes("Scanned items will appear")) {
            logBox.innerHTML = "";
        }

        const newEntry = document.createElement("div");
        newEntry.className = "log-entry";
        newEntry.innerText = `[${new Date().toLocaleTimeString()}] 🚀 Scanned: ${code}`;
        
        // Naya scan sabse upar dikhane ke liye prepend kiya
        logBox.insertBefore(newEntry, logBox.firstChild); 
    }

    // Auto Start Engine
    window.addEventListener('DOMContentLoaded', () => {
        html5QrCode.start(
            { facingMode: "environment" },
            config,
            qrCodeSuccessCallback,
            qrCodeErrorCallback
        ).catch(err => console.error("Camera Initialisation Error:", err));
    });
</script>

</body>
</html>
