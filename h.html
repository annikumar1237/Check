<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ Super-Fast Live Status Barcode Scanner</title>
    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
            background-color: #0f172a; color: #f8fafc; text-align: center; padding: 20px;
        }
        .container {
            max-width: 500px; margin: 0 auto; background: #1e293b; padding: 20px; border-radius: 16px;
        }
        .tab-container { display: flex; background: #0f172a; padding: 5px; border-radius: 10px; margin-bottom: 20px; }
        .tab-btn {
            flex: 1; padding: 12px; border: none; border-radius: 8px; background: transparent;
            color: #64748b; font-size: 1rem; font-weight: bold; cursor: pointer;
        }
        .mode-in .tab-btn.active { background: #38bdf8; color: #0f172a; }
        .mode-out .tab-btn.active { background: #f97316; color: #ffffff; }
        
        #reader { width: 100%; border-radius: 12px; overflow: hidden; background: #0f172a; margin-bottom: 15px; }
        
        /* 🔔 LIVE STATUS POPUP BANNER */
        .status-banner {
            padding: 12px; border-radius: 8px; font-weight: bold; margin-bottom: 15px; font-size: 0.95rem; display: none;
        }
        .status-success { background-color: rgba(74, 222, 128, 0.2); color: #4ade80; border: 1px solid #4ade80; }
        .status-warn { background-color: rgba(245, 158, 11, 0.2); color: #f59e0b; border: 1px solid #f59e0b; }
        .status-error { background-color: rgba(248, 113, 113, 0.2); color: #f87171; border: 1px solid #f87171; }

        .log-box {
            background: #0f172a; border-radius: 8px; padding: 10px; max-height: 180px; overflow-y: auto; text-align: left; font-family: monospace;
        }
        .log-entry { padding: 6px 10px; border-bottom: 1px solid #1e293b; font-size: 0.85rem; }
    </style>
</head>
<body class="mode-in" id="mainBody">

<div class="container">
    <div class="tab-container">
        <button class="tab-btn active" id="btnIn" onclick="switchMode('IN')">📥 IN MODE</button>
        <button class="tab-btn" id="btnOut" onclick="switchMode('OUT')">📤 OUT MODE</button>
    </div>

    <!-- 🔔 Live Server Response Banner -->
    <div id="statusBanner" class="status-banner">Scanning...</div>

    <div id="reader"></div>
    
    <div class="log-box" id="logBox">
        <div style="color: #64748b; text-align:center; padding: 10px;">History will appear here...</div>
    </div>
</div>

<script>
    // ⚠️ APNI DEPLOYED URL YAHA PASTE KAREIN
    const scriptUrl = "https://script.google.com/macros/s/AKfycbxIjzy8BFpHRsoBz4vKnResTi5l35CLk4HIKocLkhVNh1tWxoXSMMbbZFxpfALYJ7ce/exec";

    let currentMode = "IN";
    let isProcessing = false;
    
    // 🧠 LOCAL MEMORY DATABASE (Phone ke andar hi record track karne ke liye)
    const localDatabase = new Map(); 

    function switchMode(mode) {
        currentMode = mode;
        document.getElementById("mainBody").className = mode === "IN" ? "mode-in" : "mode-out";
        document.getElementById("btnIn").classList.toggle("active", mode === "IN");
        document.getElementById("btnOut").classList.toggle("active", mode === "OUT");
    }

    function showStatus(text, type) {
        const banner = document.getElementById("statusBanner");
        banner.innerText = text;
        banner.className = "status-banner " + (type === "success" ? "status-success" : type === "warn" ? "status-warn" : "status-error");
        banner.style.display = "block";
    }

    function playBeep(freq) {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            osc.frequency.setValueAtTime(freq, ctx.currentTime);
            osc.connect(ctx.destination);
            osc.start(); osc.stop(ctx.currentTime + 0.12);
        } catch (e) {}
    }

    const qrCodeSuccessCallback = (decodedText) => {
        if (isProcessing) return; 
        isProcessing = true;

        const lastStatus = localDatabase.get(decodedText);

        // ⚡ INSTANT CHECK (Bina network delay ke phone me hi turant check)
        if (currentMode === "IN" && lastStatus === "IN") {
            showStatus(`⚠️ Already IN: ${decodedText}`, "warn");
            playBeep(400); 
            addLogToScreen(`⚠️ Already IN (Local Cache): ${decodedText}`, "#f59e0b");
            sendDataToGoogleSheet(decodedText); // Background sync
            return;
        } 
        
        if (currentMode === "OUT" && lastStatus === "OUT") {
            showStatus(`⚠️ Already OUT: ${decodedText}`, "warn");
            playBeep(400); 
            addLogToScreen(`⚠️ Already OUT (Local Cache): ${decodedText}`, "#f59e0b");
            sendDataToGoogleSheet(decodedText); // Background sync
            return;
        }

        // Agar pehli baar scan ho rha h ya status alag h, toh network verify chalao
        showStatus("Verifying with Google Sheet...", "warn");
        sendDataToGoogleSheet(decodedText);
    };

    // Google sheet se baatein karna aur local memory sync karna
    function sendDataToGoogleSheet(barcodeData) {
        fetch(scriptUrl, {
            method: "POST",
            body: JSON.stringify({ barcode: barcodeData, type: currentMode })
        })
        .then(res => res.json())
        .then(response => {
            if (response.status === "success") {
                if (response.message.includes("Already Scanned - IN")) {
                    localDatabase.set(barcodeData, "IN"); // Memory me update kara
                    showStatus(`⚠️ Already IN: ${barcodeData}`, "warn");
                    playBeep(400); 
                    addLogToScreen(`⚠️ Already IN: ${barcodeData}`, "#f59e0b");
                } 
                else if (response.message.includes("Already Scanned - OUT")) {
                    localDatabase.set(barcodeData, "OUT"); // Memory me update kara
                    showStatus(`⚠️ Already OUT: ${barcodeData}`, "warn");
                    playBeep(400); 
                    addLogToScreen(`⚠️ Already OUT: ${barcodeData}`, "#f59e0b");
                }
                else {
                    // Fresh Success Entry
                    localDatabase.set(barcodeData, currentMode); // Memory update
                    showStatus(`✅ Success: ${barcodeData}`, "success");
                    playBeep(1000); 
                    addLogToScreen(`✅ ${currentMode}: ${barcodeData}`, currentMode === "IN" ? "#4ade80" : "#f97316");
                }
            } else {
                // Rejected (Bina IN ke OUT lagane par)
                showStatus(`❌ ${response.message}`, "error");
                playBeep(250); 
                addLogToScreen(`❌ Failed: ${response.message}`, "#f87171");
            }
            // Cooldown delay taaki ek scan do baar na khinche turant
            setTimeout(() => { isProcessing = false; }, 1200); 
        })
        .catch(err => {
            showStatus("❌ Network Error!", "error");
            console.error(err);
            isProcessing = false;
        });
    }

    function addLogToScreen(msg, color) {
        const logBox = document.getElementById("logBox");
        if(logBox.innerHTML.includes("History will appear")) logBox.innerHTML = "";
        
        // Dubara wahi message list me double na dikhe usko check karne ke liye
        if(logBox.firstChild && logBox.firstChild.innerText.includes(msg)) return;

        const entry = document.createElement("div");
        entry.className = "log-entry";
        entry.style.color = color;
        entry.innerText = `[${new Date().toLocaleTimeString()}] ${msg}`;
        logBox.insertBefore(entry, logBox.firstChild);
    }

    const html5QrCode = new Html5Qrcode("reader");
    window.addEventListener('DOMContentLoaded', () => {
        html5QrCode.start({ facingMode: "environment" }, { fps: 25, qrbox: (w, h) => ({ width: w * 0.9, height: h * 0.4 }) }, qrCodeSuccessCallback, () => {});
    });
</script>
</body>
</html>
