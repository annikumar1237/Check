<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ IN - Continuous Barcode Scanner</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif; background-color: #0f172a; color: #f8fafc; text-align: center; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; background: #1e293b; padding: 20px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        h2 { color: #38bdf8; margin-bottom: 5px; }
        p { font-size: 0.85rem; color: #94a3b8; margin-bottom: 20px; }
        #reader { width: 100%; border: 2px dashed #38bdf8; border-radius: 12px; overflow: hidden; background: #0f172a; }
        .log-box { margin-top: 20px; background: #0f172a; border-radius: 8px; padding: 10px; max-height: 150px; overflow-y: auto; text-align: left; font-family: monospace; font-size: 0.85rem; }
        .log-entry { padding: 6px 10px; border-bottom: 1px solid #1e293b; color: #4ade80; }
    </style>
</head>
<body>
<div class="container">
    <h2>📥 IN SCANNER</h2>
    <p>Entry karne ke liye scan karein (Data E/F ya G/H me jayega)</p>
    <div id="reader"></div>
    <div class="log-box" id="logBox">
        <div style="color: #64748b; text-align:center; padding: 10px;">Scanned items will appear here instantly...</div>
    </div>
</div>
<script>
    // ⚠️ YAHAN APNI WEB APP URL DAALEIN
    const scriptUrl = "https://script.google.com/macros/s/AKfycbxIjzy8BFpHRsoBz4vKnResTi5l35CLk4HIKocLkhVNh1tWxoXSMMbbZFxpfALYJ7ce/exec"; 
    const scannedCache = new Map();
    const COOLDOWN_TIME = 3000;

    function playBeep() {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            osc.frequency.setValueAtTime(1000, ctx.currentTime);
            osc.connect(ctx.destination);
            osc.start(); osc.stop(ctx.currentTime + 0.08);
        } catch (e) {}
    }

    const html5QrCode = new Html5Qrcode("reader");
    const config = { fps: 30, qrbox: (w, h) => ({ width: w * 0.9, height: h * 0.4 }), formatsToSupport: [Html5QrcodeSupportedFormats.QR_CODE, Html5QrcodeSupportedFormats.EAN_13, Html5QrcodeSupportedFormats.CODE_128] };

    const qrCodeSuccessCallback = (decodedText) => {
        const currentTime = Date.now();
        if (scannedCache.has(decodedText) && (currentTime - scannedCache.get(decodedText) < COOLDOWN_TIME)) return;
        scannedCache.set(decodedText, currentTime);
        playBeep();
        if (navigator.vibrate) navigator.vibrate(70); 
        addLogToScreen(decodedText);
        sendDataInBackground(decodedText);
    };

    function sendDataInBackground(barcodeData) {
        // Yahan se hum type: "IN" bhej rahe hain
        const payload = { barcode: barcodeData, type: "IN", timestamp: new Date().toLocaleString() };
        fetch(scriptUrl, { method: "POST", mode: "no-cors", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) })
        .catch(err => console.error(err));
    }

    function addLogToScreen(code) {
        const logBox = document.getElementById("logBox");
        if(logBox.innerHTML.includes("Scanned items will appear")) logBox.innerHTML = "";
        const newEntry = document.createElement("div");
        newEntry.className = "log-entry";
        newEntry.innerText = `[${new Date().toLocaleTimeString()}] 📥 IN: ${code}`;
        logBox.insertBefore(newEntry, logBox.firstChild); 
    }

    window.addEventListener('DOMContentLoaded', () => {
        html5QrCode.start({ facingMode: "environment" }, config, qrCodeSuccessCallback, () => {}).catch(err => console.error(err));
    });
</script>
</body>
</html>
